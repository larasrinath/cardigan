<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardigan</title>
<!--
  Cardigan results page: the extension page the toolbar icon opens next to an Anaplan tab.
  The markup and results.css are the owner's design; the script is src/results, built into
  dist/results.js. Nothing here is loaded from outside the extension, and no script or handler is written inline.
  map.css styles a model's map (src/map), which the script puts into #mapHost. It comes after results.css, whose tokens it uses.
-->
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="results.css">
<link rel="stylesheet" href="map.css">
</head>
<body>
<a class="skip" href="#view">Skip to results</a>

<div class="top">
  <header class="hd">
    <div class="brand">
      <img src="icons/128.png" alt="" width="26" height="26">
      <span class="brand-name">Cardigan<span class="ver" id="version"></span></span>
    </div>
    <div class="meta" id="hdMeta"></div>
    <div class="hd-actions">
      <button class="btn" id="runAgain" title="Analyse the Anaplan tab again">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 3.3v3.5h-3.5"/><path d="M12.95 9.75a5.25 5.25 0 1 1-1.24-5.46l2.7 2.54"/></svg>
        Run again
      </button>
      <button id="themeToggle" class="icon-btn" aria-label="Switch colour theme" title="Switch colour theme"></button>
    </div>
  </header>
  <nav class="topnav" id="topnav" aria-label="Result tables" hidden>
    <div class="nav-list" id="navList"></div>
    <div class="nav-compact" id="navCompact"></div>
  </nav>
</div>

<div class="banners" id="banners"></div>

<div class="shell">
  <main id="main">
    <div id="view" tabindex="-1"></div>
    <div id="mapHost" hidden></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-hd">
    <div style="flex:1;min-width:0">
      <h2 id="drawerTitle"></h2>
      <div class="d-sub" id="drawerSub"></div>
    </div>
    <button type="button" class="btn primary" id="drawerMap" data-act="map-node" hidden><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.2 5.8 2.5l4.4 1.8 4-1.7v9.2l-4 1.7-4.4-1.8-4 1.7Z"/><path d="M5.8 2.5v9.2M10.2 4.3v9.2"/></svg>Open in Model map</button>
    <button class="icon-btn" id="drawerClose" aria-label="Close details panel">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13"/></svg>
    </button>
  </div>
  <div class="drawer-bd" id="drawerBody"></div>
</aside>

<div class="popover" id="popover" role="dialog" aria-label="Column options" hidden></div>
<div class="toast" id="toast" role="status"></div>
<p class="sr-only" aria-live="polite" id="live"></p>

<script src="dist/results.js"></script>
</body>
</html>
