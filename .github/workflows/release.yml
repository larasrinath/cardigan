name: Release Cardigan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardigan-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow from main."
          exit 1

      # Checked before anything is released, so a missing secret never uses up a version.
      - name: Validate Chrome Web Store credentials
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        shell: bash
        run: |
          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all project checks
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::manifest.json and package.json versions do not match."
            exit 1
          fi
          TAG="v$VERSION"
          ZIP="release/cardigan-$VERSION.zip"
          test -s "$ZIP"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG already exists. Bump the version in manifest.json and package.json before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cardigan $VERSION" \
            --generate-notes

  store:
    name: Submit to Chrome Web Store
    needs: release
    # A release made with GITHUB_TOKEN does not start other workflows, so store.yml's release trigger does not also fire.
    uses: ./.github/workflows/store.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
