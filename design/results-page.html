<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardigan — Demo - Assortment Planning</title>
<!--
  Cardigan results page (design deliverable).
  Self-contained: inline CSS + vanilla JS, no external fonts/scripts/CDNs/images,
  suitable for a Chrome extension page under a strict content security policy.
  All fictional sample data lives in one JSON object (SAMPLE) at the top of the script.
-->
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#faf9f5; --panel:#ffffff; --panel-2:#f3f1ea; --panel-3:#eceade;
  --border:#e5e4df; --border-strong:#d4d2c8;
  --text:#191919; --text-2:#5b584f; --text-3:#76726a;
  --ink:#262625; --ink-text:#faf9f5;
  --accent:#2b5bd7; --accent-soft:#e9eefb; --accent-ink:#1f46b4;
  --danger:#b3261e; --danger-soft:#f8e7e4;
  --warn:#8a5a00;  --warn-soft:#faf0d7;
  --ok:#1e7b47;    --ok-soft:#e7f2ea;
  --ring:#2b5bd7;
  --shadow:0 10px 30px rgba(25,25,25,.16);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xs:4px; --r-sm:8px; --r-md:12px;
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --panel-2:#242422; --panel-3:#2c2c29;
  --border:#2f2f2b; --border-strong:#40403a;
  --text:#faf9f5; --text-2:#aaa69c; --text-3:#827d72;
  --ink:#faf9f5; --ink-text:#191919;
  --accent:#8fa8f2; --accent-soft:#283049; --accent-ink:#b9c8f8;
  --danger:#e07a70; --danger-soft:#3b2522;
  --warn:#d9a83f;  --warn-soft:#3a311c;
  --ok:#71c08f;    --ok-soft:#20332a;
  --ring:#8fa8f2;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-xs)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-48px;z-index:100;background:var(--ink);color:var(--ink-text);padding:8px 14px;border-radius:999px;text-decoration:none;transition:top .15s}
.skip:focus-visible{top:12px}
::placeholder{color:var(--text-3)}

/* ---------- header ---------- */
.hd{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{display:block}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.01em}
.ver{font-family:var(--mono);font-size:11px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.meta{min-width:0;flex:1}
.meta-app{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-sub{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-sub .dotsep{margin:0 6px;color:var(--text-3)}
.hd-actions{display:flex;align-items:center;gap:8px;flex:none}
.preview-lab{font-size:12px;color:var(--text-3)}
.select{
  background:var(--panel-2);border:1px solid var(--border-strong);border-radius:999px;
  padding:5px 10px;font-size:12px;color:var(--text);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text);
  padding:6px 14px;font-size:12.5px;font-weight:550;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 11px;font-size:12px}
.btn svg{flex:none}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:999px;border:1px solid var(--border-strong);background:var(--panel);color:var(--text-2);
  transition:background .15s;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.nav-toggle{display:none}

/* ---------- banners ---------- */
.banners{padding:12px 20px 0;display:grid;gap:8px;max-width:1600px;margin:0 auto}
.banner{
  display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);
  padding:10px 14px;font-size:12.5px;border:1px solid;
}
.banner svg{flex:none;margin-top:1px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--text)}
.banner.warn svg{color:var(--warn)}
.banner.note{background:var(--panel-2);border-color:var(--border);color:var(--text-2)}
.banner strong{font-weight:600}
.banner code{font-family:var(--mono);font-size:11.5px}

/* ---------- shell / nav ---------- */
.shell{display:flex;gap:20px;max-width:1600px;margin:0 auto;padding:12px 20px 32px;align-items:flex-start}
.sidenav{
  width:224px;flex:none;position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:8px;
}
.sidenav h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);padding:8px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--text);
  transition:background .12s;
}
.nav-item:hover{background:var(--panel-2)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--panel-2);border-radius:999px;padding:1px 7px}
.nav-item[aria-current="page"] .cnt{background:transparent;color:var(--accent-ink)}
.nav-item.disabled{opacity:.5;cursor:not-allowed}
.nav-item.disabled:hover{background:none}
.nav-item .soon{font-size:10.5px;color:var(--text-3);border:1px dashed var(--border-strong);border-radius:999px;padding:0 6px;margin-left:auto}

main{flex:1;min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 10px;font-size:12.5px;color:var(--text-2)}
.crumbs button{color:var(--accent);text-decoration:none;border-radius:var(--r-xs)}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--text-3)}
.crumbs .ctx{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);
  border-radius:999px;padding:2px 6px 2px 10px;font-size:12px;font-weight:550;
}
.crumbs .ctx button{display:inline-flex;color:inherit;border-radius:999px;padding:1px}
.view-title{font-size:17px;font-weight:650;margin:0 0 12px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-wrap{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:999px;padding:0 8px 0 12px;height:32px;min-width:280px;color:var(--text-3);
}
.search-wrap:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in srgb,var(--ring) 30%,transparent)}
.search-wrap input{border:0;background:none;flex:1;min-width:80px;color:var(--text);font-size:12.5px}
.search-wrap input:focus-visible{outline:none}
.search-wrap kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2);
}
.search-clear{display:none;color:var(--text-3);border-radius:999px;padding:2px}
.search-clear:hover{color:var(--text)}
.search-wrap.has-value .search-clear{display:inline-flex}
.rowcount{margin-left:auto;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.table-wrap{
  position:relative;overflow:auto;max-height:calc(100vh - 268px);min-height:220px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--panel-2);color:var(--text-2);
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:left;
  border-bottom:1px solid var(--border-strong);padding:0;white-space:nowrap;
}
.th-in{display:flex;align-items:center;gap:2px;padding:8px 10px}
.th-sort{display:inline-flex;align-items:center;gap:5px;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;border-radius:var(--r-xs);padding:1px 2px}
.th-sort:hover{color:var(--text)}
.th-sort .dir{color:var(--accent);font-size:9px;width:9px}
.th-filter{display:inline-flex;padding:3px;border-radius:999px;color:var(--text-3)}
.th-filter:hover{color:var(--text);background:var(--panel-3)}
.th-filter.active{color:var(--accent)}
.th-filter .fdot{position:absolute}
th.num .th-in,td.num{justify-content:flex-end;text-align:right}
tbody td{
  padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;
  max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.cell-t{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.link{color:var(--accent);border-radius:var(--r-xs);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.link:hover{text-decoration:underline}
.dash{color:var(--text-3)}
.scroll-fade{
  position:sticky;bottom:0;left:0;right:0;height:26px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--panel));opacity:1;transition:opacity .2s;
}
.table-wrap.at-end .scroll-fade,.table-wrap.no-scroll .scroll-fade{opacity:0}

/* pills, chips, badges, tags */
.id-pill{
  font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:5px;padding:1px 6px;color:var(--text-2);cursor:copy;max-width:180px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:1px;transition:border-color .12s,color .12s;
}
.id-pill:hover{border-color:var(--accent);color:var(--accent)}
.nr-hint{font-size:10.5px;color:var(--text-3);margin-left:5px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:4px;white-space:normal}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--text-2);max-width:300px;
}
.chip .cell-t{color:inherit}
.chip .sw{width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.badge.gone{background:var(--danger-soft);color:var(--danger);margin-left:5px}
.badge.pub{background:var(--ok-soft);color:var(--ok)}
.badge.unpub{background:var(--warn-soft);color:var(--warn)}
.badge .bdot{width:6px;height:6px;border-radius:999px;background:currentColor}
.tag{
  display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-xs);
  padding:1px 7px;font-size:11.5px;color:var(--text-2);
}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.pager .pages{display:flex;gap:4px;align-items:center}
.pg-btn{min-width:28px;height:28px;border-radius:999px;border:1px solid var(--border-strong);background:var(--panel);padding:0 8px;font-variant-numeric:tabular-nums}
.pg-btn:hover:not([disabled]){background:var(--panel-2)}
.pg-btn[aria-current="true"]{background:var(--ink);color:var(--ink-text);border-color:var(--ink);font-weight:600}
.pg-btn[disabled]{opacity:.4;cursor:default}
.pager select{border:1px solid var(--border-strong);background:var(--panel);border-radius:999px;padding:3px 8px;font-size:12px}

/* empty states */
.empty{padding:56px 20px;text-align:center;color:var(--text-2)}
.empty .e-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty .e-sub{font-size:12.5px;margin-bottom:14px}
.empty svg{color:var(--text-3);margin-bottom:10px}

/* ---------- overview ---------- */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.stat .s-lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
.stat .s-num{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.stat .s-sub{font-size:11.5px;color:var(--text-2);margin-top:4px}
.ov-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.panel h3{font-size:13px;margin-bottom:10px}
.typebars{display:grid;gap:6px}
.typebar{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;font-size:12px}
.typebar .tb-track{height:7px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.typebar .tb-fill{height:100%;background:var(--accent);border-radius:999px;opacity:.75}
.typebar .tb-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.model-row{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--border)}
.model-row:last-child{border-bottom:0}
.model-row .m-name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.model-row .m-sub{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.warn-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.warn-list li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
.wdot{width:8px;height:8px;border-radius:999px;flex:none;margin-top:5px}
.wdot.err{background:var(--danger)}
.wdot.wr{background:var(--warn)}
.warn-list .wl-ink{color:var(--text)}
.warn-list code{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border-radius:4px;padding:0 4px}

/* ---------- details view ---------- */
.dl{display:grid;grid-template-columns:220px 1fr;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px}
.dl dt{padding:9px 16px;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--border);background:var(--panel-2)}
.dl dd{padding:9px 16px;margin:0;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.diag{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md)}
.diag summary{
  cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px;
}
.diag summary::-webkit-details-marker{display:none}
.diag summary .car{transition:transform .15s;color:var(--text-3)}
.diag[open] summary .car{transform:rotate(90deg)}
.diag-body{border-top:1px solid var(--border);padding:12px 16px}
.diag pre{
  font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--panel-2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;overflow:auto;max-height:340px;margin:0 0 10px;
  color:var(--text-2);white-space:pre-wrap;word-break:break-word;
}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,15,12,.44);z-index:60;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.drawer{
  position:fixed;top:0;right:0;height:100dvh;width:min(540px,94vw);z-index:70;
  background:var(--panel);border-left:1px solid var(--border-strong);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-hd{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-hd h2{font-size:14.5px;flex:1;word-break:break-word}
.drawer-hd .d-sub{font-size:12px;color:var(--text-2);margin-top:3px}
.drawer-bd{overflow:auto;padding:14px 16px;flex:1}
.d-sec{margin-bottom:20px}
.d-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:8px}
.d-dl{display:grid;grid-template-columns:150px 1fr;gap:0;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.d-dl dt{padding:7px 12px;font-size:11.5px;color:var(--text-2);background:var(--panel-2);border-bottom:1px solid var(--border)}
.d-dl dd{padding:7px 12px;margin:0;font-size:12.5px;border-bottom:1px solid var(--border);white-space:normal;word-break:break-word}
.d-dl dt:last-of-type,.d-dl dd:last-of-type{border-bottom:0}
.mini{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);border-collapse:separate;border-spacing:0;font-size:12px;overflow:hidden}
.mini th{background:var(--panel-2);color:var(--text-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.mini td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top;white-space:normal;word-break:break-word}
.mini tr:last-child td{border-bottom:0}
.grp-page{font-size:12.5px;font-weight:600;margin:12px 0 6px}
.usage-list{margin:0;padding:0 0 0 2px;list-style:none;display:grid;gap:6px}
.usage-list li{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.usage-list .u-as{color:var(--text-2);font-size:11.5px}

/* ---------- popover ---------- */
.popover{
  position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:var(--r-md);box-shadow:var(--shadow);width:260px;max-height:340px;display:flex;flex-direction:column;
}
.pop-hd{padding:10px 12px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pop-hd button{font-size:11px;color:var(--accent)}
.pop-bd{overflow:auto;padding:2px 6px 8px}
.pop-opt{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:var(--r-xs);font-size:12.5px;cursor:pointer;user-select:none}
.pop-opt:hover{background:var(--panel-2)}
.pop-opt input{accent-color:var(--accent);flex:none}
.pop-opt .po-cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pop-empty{padding:10px;font-size:12px;color:var(--text-3)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:90;
  background:var(--ink);color:var(--ink-text);border-radius:999px;padding:8px 16px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:80vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1120px){
  .nav-toggle{display:inline-flex}
  .sidenav{
    position:fixed;left:0;top:0;height:100dvh;max-height:none;width:264px;z-index:70;border-radius:0;
    transform:translateX(-104%);transition:transform .2s cubic-bezier(.4,0,.2,1);border:0;border-right:1px solid var(--border-strong);
    box-shadow:var(--shadow);
  }
  .sidenav.open{transform:translateX(0)}

/* ================= utilities ================= */
const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function valText(v){
  if (v == null || v === '') return '';
  if (Array.isArray(v)) return v.map(valText).join(' ');
  if (typeof v === 'object'){
    if ('t' in v) return v.t;
    return ((v.n || '') + ' ' + (v.id || '')).trim();
  }
  return String(v);
}
function numVal(v){ return (typeof v === 'number') ? v : NaN; }

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function announce(msg){ $('#live').textContent = msg; }

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copied ' + txt); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied ' + txt); }
    catch(err){ toast('Copy failed'); }
    ta.remove();
  }
}
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ================= cell renderers ================= */
function idPill(id){
  if (id == null || id === '' || id === '—') return '<span class="dash">—</span>';
  const s = String(id);
  return `<button type="button" class="id-pill" data-copy="${esc(s)}" title="Copy ${esc(s)}" aria-label="Copy ID ${esc(s)}">${esc(s)}</button>`;
}
function namedHtml(v){
  if (v == null || v === '' || v === '—') return '<span class="dash">—</span>';
  if (typeof v !== 'object') return `<span class="cell-t" title="${esc(v)}">${esc(v)}</span>`;
  let out = '';
  if (isClosed() || v.nr || !v.n){
    out += idPill(v.id) + '<span class="nr-hint">name not read</span>';
  } else {
    out += `<span class="cell-t" title="${esc(v.n)}">${esc(v.n)}</span>`;
  }
  if (v.gone) out += '<span class="badge gone">not in the model</span>';
  return out;
}
function chipsHtml(arr){
  if (!arr || !arr.length) return '<span class="dash">—</span>';
  return '<span class="chips">' + arr.map(c=>{
    if (c && typeof c === 'object' && ('n' in c || 'id' in c))
      return `<span class="chip">${namedHtml(c)}</span>`;
    if (c && typeof c === 'object' && 't' in c)
      return `<span class="chip"><i class="sw" style="background:${esc(c.c)}"></i>${esc(c.t)}</span>`;
    return `<span class="chip"><span class="cell-t" title="${esc(c)}">${esc(c)}</span></span>`;
  }).join('') + '</span>';
}
function pubHtml(v){
  const cls = v === 'Published' ? 'pub' : 'unpub';
  return `<span class="badge ${cls}"><span class="bdot"></span>${esc(v)}</span>`;
}
function cellHtml(tid, col, row){
  const v = row[col.k];
  switch (col.t){
    case 'num': {
      const n = numVal(v);
      return isNaN(n) ? '<span class="dash">—</span>' : String(n);
    }
    case 'page':
      if (!v) return '<span class="dash">—</span>';
      return `<button type="button" class="link" data-act="page" data-val="${esc(v)}" title="Show cards on ${esc(v)}">${esc(v)}</button>`;
    case 'card': {
      const label = col.k === 'n' ? '#' + row.n : (v || '(untitled card)');
      return `<button type="button" class="link" data-act="card" data-page="${esc(row.page)}" data-n="${row.n}" title="Open card details">${esc(label)}</button>`;
    }
    case 'object': {
      const o = v;
      const label = (o && o.n) ? o.n : (o ? o.id : '—');
      let out = `<button type="button" class="link" data-act="object" data-oid="${esc(o.oid || o.id)}" data-oname="${esc(label)}" title="List every page and card that uses this object">${esc(label)}</button>`;
      if (o && o.nr) out = idPill(o.id) + '<span class="nr-hint">name not read</span> ' +
        `<button type="button" class="link" data-act="object" data-oid="${esc(o.oid || o.id)}" data-oname="${esc(o.id)}">usages</button>`;
      if (o && o.gone) out += '<span class="badge gone">not in the model</span>';
      return out;
    }
    case 'id': return idPill(v);
    case 'idlist':
      if (!v || !v.length) return '<span class="dash">—</span>';
      return '<span class="chips">' + v.map(idPill).join('') + '</span>';
    case 'chips': return chipsHtml(v);
    case 'named': return namedHtml(v);
    case 'stops': return chipsHtml(v);
    case 'pub': return pubHtml(v);
    case 'tag':
      if (!v) return '<span class="dash">—</span>';
      return `<span class="tag">${esc(v)}</span>`;
    default: {
      if (v == null || v === '') return '<span class="dash">—</span>';
      return `<span class="cell-t" title="${esc(v)}">${esc(v)}</span>`;
    }
  }
}

/* ================= table engine =================
   Pagination (not virtualisation) keeps ~3,000-row tables fast: only the
   current page of <tr> nodes is ever in the DOM. */
function filteredRows(tid){
  const T = TABLES[tid];
  let rows = tableRows(tid).slice();
  if (state.context && T.hasPage) rows = rows.filter(r => r.page === state.context.v);
  const q = state.search.trim().toLowerCase();
  if (q) rows = rows.filter(r => T.cols.some(c => valText(r[c.k]).toLowerCase().includes(q)));
  const cf = state.colFilters[tid] || {};
  for (const k in cf){
    const set = cf[k];
    if (set && set.size) rows = rows.filter(r => set.has(valText(r[k])));
  }
  const s = state.sort[tid];
  if (s){
    const col = T.cols.find(c=>c.k===s.k);
    rows.sort((a,b)=>{
      const an = numVal(a[s.k]), bn = numVal(b[s.k]);
      let cmp;
      if (!isNaN(an) && !isNaN(bn)) cmp = an - bn;
      else cmp = valText(a[s.k]).toLowerCase().localeCompare(valText(b[s.k]).toLowerCase());
      if (cmp === 0 && col && col.k !== 'n' && 'n' in a) cmp = a.n - b.n;
      return s.dir === 'desc' ? -cmp : cmp;
    });
  }
  return rows;
}
function activeFilterCount(tid){
  const cf = state.colFilters[tid] || {};
  return Object.values(cf).reduce((n,set)=> n + (set && set.size ? 1 : 0), 0);
}
function isModified(tid){
  return state.search.trim() !== '' || activeFilterCount(tid) > 0 || !!state.sort[tid] || !!state.context;
}

function renderTable(tid){
  const T = TABLES[tid];
  const all = filteredRows(tid);
  const total = all.length;
  const ps = state.pageSize;
  const pages = Math.max(1, Math.ceil(total / ps));
  let p = Math.min(state.page[tid] || 0, pages - 1);
  state.page[tid] = p;
  const slice = all.slice(p*ps, p*ps + ps);
  currentSlice = slice;
  const hid = hiddenSet(tid);
  const cols = T.cols.filter(c => !hid.has(c.k));
  const srt = state.sort[tid] || {};

  const thead = '<tr>' + cols.map(c=>{
    const dir = srt.k === c.k ? srt.dir : null;
    const aria = dir ? (dir === 'asc' ? 'ascending' : 'descending') : 'none';
    const arrow = dir ? `<span class="dir" aria-hidden="true">${dir === 'asc' ? '▲' : '▼'}</span>` : '<span class="dir" aria-hidden="true"></span>';
    const fBtn = c.f ? `<button type="button" class="th-filter ${ (state.colFilters[tid]||{})[c.k]?.size ? 'active':'' }"
        data-colfilter="${esc(c.k)}" aria-label="Filter by ${esc(c.l)}" aria-haspopup="dialog" title="Filter by ${esc(c.l)}">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3h12l-4.6 5.2v4.3L6.6 14V8.2L2 3Z"/></svg></button>` : '';
    return `<th scope="col" class="${c.t==='num'||c.num?'num':''}" aria-sort="${aria}">
      <div class="th-in"><button type="button" class="th-sort" data-sort="${esc(c.k)}">${esc(c.l)}${arrow}</button>${fBtn}</div></th>`;
  }).join('') + '</tr>';

  let body = '', emptyHtml = '';
  if (tableRows(tid).length === 0){
    emptyHtml = `<div class="empty">
      <svg width="30" height="30" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 3h12l-4.6 5.2v4.3L6.6 14V8.2L2 3Z"/></svg>
      <div class="e-title">${esc(T.empty)}</div>
      <div class="e-sub">When the app has ${esc(T.label.toLowerCase())}, they will appear here after the next analysis.</div>
      </div>`;
  } else if (total === 0){
    emptyHtml = `<div class="empty">
      <svg width="30" height="30" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
      <div class="e-title">No results</div>
      <div class="e-sub">Nothing in ${esc(T.label)} matches the current ${state.search.trim() ? 'search' : ''}${state.search.trim() && activeFilterCount(tid) ? ' and ' : ''}${activeFilterCount(tid) ? 'column filters' : ''}${state.context ? (state.search.trim()||activeFilterCount(tid) ? ' and ' : '') + 'page selection' : ''}.</div>
      <button type="button" class="btn sm" data-act="reset">Clear search &amp; filters</button>
      </div>`;
  } else {
    body = slice.map(r=>'<tr>' + cols.map(c=>
      `<td class="${c.t==='num'||c.num?'num':''}">${cellHtml(tid,c,r)}</td>`).join('') + '</tr>').join('');
  }

  const from = total === 0 ? 0 : p*ps + 1, to = Math.min(total, (p+1)*ps);
  $('#view').innerHTML = `
    <h1 class="view-title">${esc(T.label)}</h1>
    <div class="toolbar">
      <div class="search-wrap ${state.search ? 'has-value' : ''}">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
        <input id="tblSearch" type="search" value="${esc(state.search)}" placeholder="Search all columns…" aria-label="Search ${esc(T.label)}">
        <button type="button" class="search-clear" data-act="clear-search" aria-label="Clear search">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3 3 13"/></svg></button>
        <kbd title="Press / to focus search">/</kbd>
      </div>
      <button type="button" class="btn sm" id="colBtn" aria-haspopup="dialog">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        Columns</button>
      <button type="button" class="btn sm" data-act="reset" ${isModified(tid) ? '' : 'hidden'}>Reset</button>
      <span class="rowcount" id="rowCount"></span>
    </div>
    <div class="table-wrap" id="tableWrap" tabindex="0" role="region" aria-label="${esc(T.label)} table">
      <table><thead>${thead}</thead><tbody>${body}</tbody></table>
      ${emptyHtml}
      <div class="scroll-fade" aria-hidden="true"></div>
    </div>
    <div class="pager" id="pager"></div>`;

  $('#rowCount').textContent = `${from}–${to} of ${total} rows` +
    (total !== tableRows(tid).length ? ` (filtered from ${tableRows(tid).length})` : '');
  renderPager(tid, p, pages, total);
  const wrap = $('#tableWrap');
  const updFade = ()=>{
    wrap.classList.toggle('at-end', wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 6);
    wrap.classList.toggle('no-scroll', wrap.scrollHeight <= wrap.clientHeight + 2);
  };
  wrap.addEventListener('scroll', updFade); updFade();
  const si = $('#tblSearch'); si.selectionStart = si.selectionEnd = si.value.length;
  announce(`${T.label}: ${total} rows${state.context ? ', filtered to ' + state.context.v : ''}`);
}

function renderPager(tid, p, pages, total){
  if (total === 0){ $('#pager').innerHTML = ''; return; }
  const nums = [];
  const push = i => nums.push(`<button type="button" class="pg-btn" data-page="${i}" ${i===p?'aria-current="true"':''} aria-label="Page ${i+1}">${i+1}</button>`);
  if (pages <= 7){ for (let i=0;i<pages;i++) push(i); }
  else {
    push(0);
    const lo = Math.max(1, p-1), hi = Math.min(pages-2, p+1);
    if (lo > 1) nums.push('<span aria-hidden="true">…</span>');
    for (let i=lo;i<=hi;i++) push(i);
    if (hi < pages-2) nums.push('<span aria-hidden="true">…</span>');
    push(pages-1);
  }
  $('#pager').innerHTML = `
    <button type="button" class="pg-btn" data-page="${p-1}" ${p===0?'disabled':''} aria-label="Previous page">‹</button>
    <span class="pages">${nums.join('')}</span>
    <button type="button" class="pg-btn" data-page="${p+1}" ${p>=pages-1?'disabled':''} aria-label="Next page">›</button>
    <span style="margin-left:auto">Rows per page
      <select id="pageSize" aria-label="Rows per page">
        ${[25,50,100].map(n=>`<option value="${n}" ${n===state.pageSize?'selected':''}>${n}</option>`).join('')}
      </select></span>`;
}

/* ================= popovers (column filter / column chooser) ================= */
let popAnchor = null;
function closePopover(){
  const p = $('#popover');
  if (!p.hidden){ p.hidden = true; p.innerHTML=''; }
  if (popAnchor){ popAnchor = null; }
}
function openPopover(anchor, html){
  const p = $('#popover');
  p.innerHTML = html; p.hidden = false; popAnchor = anchor;
  const r = anchor.getBoundingClientRect();
  const pw = 260;
  let x = Math.min(r.left, window.innerWidth - pw - 12);
  let y = r.bottom + 6;
  p.style.left = Math.max(8, x) + 'px';
  p.style.top = '0px'; p.style.visibility = 'hidden';
  requestAnimationFrame(()=>{
    const ph = Math.min(p.offsetHeight, 340);
    if (y + ph > window.innerHeight - 10) y = Math.max(10, r.top - ph - 6);
    p.style.top = y + 'px'; p.style.visibility = 'visible';
    const first = p.querySelector('input,button'); if (first) first.focus();
  });
}
function openColFilter(tid, key, anchor){
  const T = TABLES[tid];
  const col = T.cols.find(c=>c.k===key);
  const counts = new Map();
  tableRows(tid).forEach(r=>{ const v = valText(r[key]); counts.set(v,(counts.get(v)||0)+1); });
  const vals = [...counts.keys()].sort((a,b)=>a.localeCompare(b));
  if (!state.colFilters[tid]) state.colFilters[tid] = {};
  const sel = state.colFilters[tid][key];
  const checked = v => (!sel || !sel.size || sel.has(v)) ? 'checked' : '';
  openPopover(anchor, `
    <div class="pop-hd"><span>Filter: ${esc(col.l)}</span><button type="button" data-popact="all">Show all</button></div>
    <div class="pop-bd">
      ${vals.length ? vals.map(v=>`
        <label class="pop-opt"><input type="checkbox" data-fval="${esc(v)}" ${checked(v)}>
        <span style="overflow:hidden;text-overflow:ellipsis">${v === '' ? '<em>(blank)</em>' : esc(v)}</span>
        <span class="po-cnt">${counts.get(v)}</span></label>`).join('')
      : '<div class="pop-empty">No values</div>'}
    </div>`);
  $('#popover').querySelectorAll('input[data-fval]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      if (!state.colFilters[tid][key]) state.colFilters[tid][key] = new Set(vals);
      const set = state.colFilters[tid][key];
      if (inp.checked) set.add(inp.dataset.fval); else set.delete(inp.dataset.fval);
      if (set.size === vals.length) set.clear();
      state.page[tid] = 0; renderTable(tid);
    });
  });
  $('#popover').querySelector('[data-popact="all"]').addEventListener('click', ()=>{
    state.colFilters[tid][key] = new Set(); state.page[tid] = 0;
    closePopover(); renderTable(tid);
  });
}
function openColChooser(tid, anchor){
  const T = TABLES[tid], hid = hiddenSet(tid);
  openPopover(anchor, `
    <div class="pop-hd"><span>Show / hide columns</span><button type="button" data-popact="defaults">Defaults</button></div>
    <div class="pop-bd">
      ${T.cols.map(c=>`
        <label class="pop-opt"><input type="checkbox" data-col="${esc(c.k)}" ${hid.has(c.k)?'':'checked'}>
        <span>${esc(c.l)}</span>${c.h?'<span class="po-cnt">ID</span>':''}</label>`).join('')}
    </div>`);
  $('#popover').querySelectorAll('input[data-col]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      if (inp.checked) hid.delete(inp.dataset.col); else hid.add(inp.dataset.col);
      renderTable(tid);
    });
  });
  $('#popover').querySelector('[data-popact="defaults"]').addEventListener('click', ()=>{
    state.hidden[tid] = new Set(T.cols.filter(c=>c.h).map(c=>c.k));
    closePopover(); renderTable(tid);
  });
}

function closeDrawer(){

function rowTitle(tid, r){

    case 'pages': return r.page;

    case 'condFmt': return `Formatting — card ${r.n}, section ${r.sec}`;
    case 'actionButtons': return `Button “${r.label}”`;

function cardByRef(page, n){ return SAMPLE.cards.find(c=>c.page===page && c.n===Number(n)); }

        <tbody>${flts.map(f=>`<tr><td>${f.sec}</td><td>${esc(f.on)}</td><td>${esc(f.dim)}</td><td>${esc(f.grp)} · ${esc(f.match)}</td>

/* ================= CSV export ================= */
function csvCell(v){
  let s;
  if (Array.isArray(v)) s = v.map(csvCell).join('; ');
  else if (v && typeof v === 'object'){
    if ('t' in v) s = `${v.t} (${v.c})`;
    else s = (v.n || v.id || '') + (v.gone ? ' [not in the model]' : '');
  } else s = (v == null ? '' : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function tableCsv(tid){
  const T = TABLES[tid];
  const lines = [T.cols.map(c=>csvCell(c.l)).join(',')];
  filteredRows(tid).forEach(r=>lines.push(T.cols.map(c=>csvCell(r[c.k])).join(',')));
  return lines.join('\r\n');
}
function downloadThis(){
  const d = new Date().toISOString().slice(0,10);
  if (TABLES[state.view]){
    downloadFile(`cardigan-${state.view}-${d}.csv`, tableCsv(state.view));
    toast(`Downloaded ${TABLES[state.view].label} as CSV`);
  } else if (state.view === 'overview'){
    const m = SAMPLE.meta;
    const lines = ['Metric,Value',
      csvCell('Pages')+','+SAMPLE.pages.length,
      csvCell('Cards')+','+SAMPLE.cards.length,
      csvCell('Grid sections')+','+countFor('gridSections'),
      csvCell('Filters')+','+countFor('filters'),
      csvCell('Formatting rules')+','+countFor('condFmt'),
      csvCell('Action buttons')+','+countFor('actionButtons'),
      csvCell('Where Used objects')+','+countFor('whereUsed'),
      csvCell('Export time')+','+csvCell(m.exportTime)];
    downloadFile(`cardigan-overview-${d}.csv`, lines.join('\r\n'));
    toast('Downloaded overview summary as CSV');
  } else {
    const m = SAMPLE.meta, mod = m.models[0];
    const lines = ['Field,Value',
      'Product,'+csvCell(m.product+' v'+m.version),
      'Export time,'+csvCell(m.exportTime),
      'App,'+csvCell(m.app.name+' ('+m.app.id+')'),
      'Model,'+csvCell(mod.name+' ('+mod.id+')'),
      'Workspace,'+csvCell(mod.workspace+' ('+mod.workspaceId+')'),
      'Host,'+csvCell(mod.host)];
    downloadFile(`cardigan-details-${d}.csv`, lines.join('\r\n'));
    toast('Downloaded export details as CSV');
  }
}

/* ================= view switching ================= */
function navTo(id){
  closePopover();
  state.view = id;
  state.search = '';
  if (!state._keepContext) state.context = null;
  state._keepContext = false;
  renderAll();
  $('#view').focus({preventScroll:true});
  $('#sidenav').classList.remove('open');
  $('#navToggle').setAttribute('aria-expanded','false');
  $('#scrim').classList.remove('show');
  setTimeout(()=>{ if(!$('#drawer').classList.contains('show') && !$('#sidenav').classList.contains('open')) $('#scrim').hidden = true; },210);
  window.scrollTo({top:0});
}
function gotoPage(pageName){
  state._keepContext = true;
  navTo('cards');
  state.context = {k:'page', v:pageName, label:'Page'};
  renderAll();
  closeDrawer();
}
function renderAll(){
  renderNav(); renderCrumbs();
  if (state.view === 'overview') renderOverview();
  else if (state.view === 'details') renderDetails();
  else renderTable(state.view);
}

/* ================= global events ================= */
document.addEventListener('click', e=>{
  const pop = $('#popover');
  const inPop = pop.contains(e.target);
  const anchorish = e.target.closest('[data-colfilter], #colBtn');
  if (!pop.hidden && !inPop && !anchorish) closePopover();

  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn){ e.stopPropagation(); copyText(copyBtn.dataset.copy); return; }

  const act = e.target.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'page'){ gotoPage(act.dataset.val); return; }
    if (a === 'card'){ openCardDrawer(act.dataset.page, act.dataset.n, act); return; }
    if (a === 'object'){ openObjectDrawer(act.dataset.oid, act); return; }
    if (a === 'clear-context'){ state.context = null; state.page[state.view] = 0; renderAll(); return; }
    if (a === 'reset'){
      state.search=''; state.colFilters[state.view]={}; delete state.sort[state.view];
      state.context=null; state.page[state.view]=0; renderAll(); return;
    }
    if (a === 'clear-search'){ state.search=''; state.page[state.view]=0; renderTable(state.view); $('#tblSearch').focus(); return; }
    if (a === 'copy-diag'){ copyText(SAMPLE.diagnostics); return; }
  }

  const nav = e.target.closest('[data-nav]');
  if (nav && !nav.classList.contains('disabled')){ navTo(nav.dataset.nav); return; }
  if (nav && nav.classList.contains('disabled')){ toast('Model map is coming in a future version'); return; }

  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn && TABLES[state.view]){
    const k = sortBtn.dataset.sort;
    const cur = state.sort[state.view];
    if (!cur || cur.k !== k) state.sort[state.view] = {k, dir:'asc'};
    else if (cur.dir === 'asc') state.sort[state.view] = {k, dir:'desc'};
    else delete state.sort[state.view];
    renderTable(state.view); return;
  }

  const cfBtn = e.target.closest('[data-colfilter]');
  if (cfBtn && TABLES[state.view]){
    if (!pop.hidden && popAnchor === cfBtn){ closePopover(); return; }
    openColFilter(state.view, cfBtn.dataset.colfilter, cfBtn); return;
  }
  if (e.target.closest('#colBtn')){
    const btn = e.target.closest('#colBtn');
    if (!pop.hidden && popAnchor === btn){ closePopover(); return; }
    openColChooser(state.view, btn); return;
  }

  const pg = e.target.closest('.pg-btn[data-page]');
  if (pg && !pg.disabled && TABLES[state.view]){
    state.page[state.view] = parseInt(pg.dataset.page, 10);
    renderTable(state.view);
    $('#tableWrap').scrollTop = 0; return;
  }

  const tr = e.target.closest('#tableWrap tbody tr');
  if (tr && !e.target.closest('button, a, input, label, select')){
    const idx = [...tr.parentNode.children].indexOf(tr);
    const row = currentSlice[idx];
    if (row) openRowDrawer(state.view, row, tr);
  }
});
document.addEventListener('input', e=>{
  if (e.target.id === 'tblSearch'){
    state.search = e.target.value; state.page[state.view] = 0;
    renderTable(state.view);
    const si = $('#tblSearch'); if (si) si.focus();
  }
});
document.addEventListener('change', e=>{
  if (e.target.id === 'pageSize'){
    state.pageSize = parseInt(e.target.value, 10); state.page[state.view] = 0;
    renderTable(state.view);
  }
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){
    if (!$('#popover').hidden){ closePopover(); return; }
    if ($('#drawer').classList.contains('show')){ closeDrawer(); return; }
    if ($('#sidenav').classList.contains('open')){
      $('#sidenav').classList.remove('open');
      $('#scrim').classList.remove('show'); $('#scrim').hidden = true;
      $('#navToggle').setAttribute('aria-expanded','false'); $('#navToggle').focus();
    }
    return;
  }
  if (e.key === '/' && TABLES[state.view] && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); const si = $('#tblSearch'); if (si) si.focus();
  }
});
$('#drawerClose').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
$('#navToggle').addEventListener('click', ()=>{
  const open = $('#sidenav').classList.toggle('open');
  $('#navToggle').setAttribute('aria-expanded', String(open));
  const s = $('#scrim');
  if (open){ s.hidden = false; requestAnimationFrame(()=>s.classList.add('show')); }
  else { s.classList.remove('show'); setTimeout(()=>{ s.hidden = true; }, 210); }
});
$('#themeToggle').addEventListener('click', toggleTheme);
$('#dlAll').addEventListener('click', ()=>{
  toast('Demo preview — in the extension this packages every table into one .zip download.');
});
$('#dlCsv').addEventListener('click', downloadThis);
$('#previewState').addEventListener('change', e=>{
  state.preview = e.target.value;
  state.colFilters = {}; state.sort = {}; state.page = {}; state.context = null; state.search = '';
  renderBanners(); renderAll();
  announce('Preview state: ' + e.target.selectedOptions[0].textContent);
});
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{
    let stored = null; try { stored = localStorage.getItem('cardigan-theme'); } catch(err){}
    if (!stored) applyTheme(e.matches ? 'dark' : 'light');
  });
}

/* ================= init ================= */
applyTheme(currentTheme());
renderHeaderMeta();
renderBanners();
renderAll();
</script>
</body>
</html>
